services:
  # Base de datos compartida
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-n8n_lab_2026}"
      POSTGRES_MULTIPLE_DATABASES: "n8n,dify"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lab_net

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:-redis_lab_2026}"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lab_net

  # n8n - Orquestación de workflows
  n8n:
    image: n8nio/n8n:latest
    environment:
      # Base config - usa LAB_HOST del .env.lab
      N8N_HOST: "${LAB_HOST:-130.117.95.60}"
      N8N_PORT: "5678"
      N8N_PROTOCOL: "http"
      WEBHOOK_URL: "http://${LAB_HOST:-130.117.95.60}:5678/"
      GENERIC_TIMEZONE: "Europe/Madrid"
      
      # Database
      DB_TYPE: "postgresdb"
      DB_POSTGRESDB_HOST: "postgres"
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: "n8n"
      DB_POSTGRESDB_USER: "n8n"
      DB_POSTGRESDB_PASSWORD: "${POSTGRES_PASSWORD:-n8n_lab_2026}"
      
      # Redis (queue mode)
      EXECUTIONS_MODE: "queue"
      QUEUE_BULL_REDIS_HOST: "redis"
      QUEUE_BULL_REDIS_PORT: "6379"
      QUEUE_BULL_REDIS_PASSWORD: "${REDIS_PASSWORD:-redis_lab_2026}"
      
      # Security
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: "admin"
      N8N_BASIC_AUTH_PASSWORD: "${N8N_BASIC_AUTH_PASSWORD:-n8n_lab_2026}"
      N8N_ENCRYPTION_KEY: "${N8N_ENCRYPTION_KEY:-clave_secreta_32_chars_minimo!!}"
      # HTTP mode (lab): disable secure cookie requirement
      N8N_SECURE_COOKIE: "false"
      
      # Limits
      N8N_PAYLOAD_SIZE_MAX: "16"
      N8N_DEFAULT_BINARY_DATA_MODE: "filesystem"
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n-backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - lab_net

  # Dify - IA, RAG, Agentes
  dify-api:
    image: langgenius/dify-api:latest
    environment:
      # Database
      DB_TYPE: "postgresql"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_USERNAME: "n8n"
      DB_PASSWORD: "${POSTGRES_PASSWORD:-n8n_lab_2026}"
      DB_DATABASE: "dify"
      
      # Redis
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-redis_lab_2026}"
      REDIS_DB: "0"
      
      # Config
      SECRET_KEY: "${DIFY_SECRET_KEY:-dify_secret_key_32_chars_minimo!!}"
      # API URL: usa LAB_HOST del .env.lab para acceso desde navegador
      CONSOLE_API_URL: "http://${LAB_HOST:-130.117.95.60}:8080"
      CONSOLE_WEB_URL: "http://${LAB_HOST:-130.117.95.60}:8080"
      SERVICE_API_URL: "http://${LAB_HOST:-130.117.95.60}:8080/v1"
      FILES_URL: "http://${LAB_HOST:-130.117.95.60}:8080/v1/files"
      
      # Storage (local para lab)
      STORAGE_TYPE: "local"
      LOCAL_STORAGE_PATH: "/var/lib/dify/storage"
      
      # Model providers (configurar según disponibilidad)
      # OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      # AZURE_OPENAI_API_KEY: "${AZURE_OPENAI_API_KEY:-}"
      # OLLAMA_BASE_URL: "http://ollama:11434"
    volumes:
      - dify_storage:/var/lib/dify/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lab_net

  dify-web:
    image: langgenius/dify-web:latest
    environment:
      # API URL: usa LAB_HOST del .env.lab para acceso desde navegador
      CONSOLE_API_URL: "http://${LAB_HOST:-130.117.95.60}:8080"
      CONSOLE_WEB_URL: "http://${LAB_HOST:-130.117.95.60}:8080"
      # Increase Node.js memory limit to prevent OOM
      NODE_OPTIONS: "--max-old-space-size=2048"
    ports:
      - "8080:3000"
    depends_on:
      - dify-api
    networks:
      - lab_net
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 1G

  dify-worker:
    image: langgenius/dify-api:latest
    command: ["celery", "worker", "-A", "app.celery", "-Q", "default", "-c", "2"]
    environment:
      DB_TYPE: "postgresql"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_USERNAME: "n8n"
      DB_PASSWORD: "${POSTGRES_PASSWORD:-n8n_lab_2026}"
      DB_DATABASE: "dify"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-redis_lab_2026}"
      REDIS_DB: "0"
      SECRET_KEY: "${DIFY_SECRET_KEY:-dify_secret_key_32_chars_minimo!!}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lab_net

  # Documentación del curso (MkDocs)
  docs:
    image: python:3.12-alpine
    working_dir: /app
    command: >
      sh -c "pip install -q mkdocs-material mkdocs-mermaid2-plugin mkdocs-git-revision-date-localized-plugin &&
             mkdocs serve --dev-addr=0.0.0.0:8001"
    volumes:
      - ./docs:/app/docs
      - ./mkdocs.yml:/app/mkdocs.yml
      - ./requirements.txt:/app/requirements.txt
    ports:
      - "8001:8001"
    networks:
      - lab_net

  # Nginx reverse proxy (opcional, para producción)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.lab.conf.template:/etc/nginx/nginx.conf.template:ro
      - ./envsubst.sh:/docker-entrypoint.sh:ro
    depends_on:
      - n8n
      - dify-web
      - docs
    networks:
      - lab_net
    entrypoint: ["/docker-entrypoint.sh", "envsubst", "/etc/nginx/nginx.conf.template"]

volumes:
  postgres_data:
  redis_data:
  n8n_data:
  dify_storage:

networks:
  lab_net:
    driver: bridge