site_name: "Curso Automatización y agentes sin código"
site_description: "Curso práctico de Automatización y agentes sin código para perfiles técnicos"
site_author: "Guillem Hernández Sola"
site_url: "https://docs.agile611.com/curso-n8n/"

repo_name: "agile611/curso-n8n"
repo_url: "https://github.com/agile611/curso-n8n"

docs_dir: "docs"
site_dir: "site"

theme:
  name: "material"
  language: "es"

  logo: "https://www.agile611.com/wp-content/uploads/2020/09/Negativo.png"
  favicon: "https://www.agile611.com/wp-content/uploads/2019/07/cropped-agile611-1-e1563910774746-1-32x32.png"

  font:
    text: "Nunito"
    code: "Nunito"

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.highlight
    - search.suggest

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: "Cambiar a modo oscuro"

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: "Cambiar a modo claro"

  icon:
    logo: material/docker
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list

  - toc:
      permalink: true
      toc_depth: 3

  - pymdownx.details
  - pymdownx.superfences

  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span

  - pymdownx.inlinehilite

  - pymdownx.tabbed:
      alternate_style: true

  - pymdownx.tasklist:
      custom_checkbox: true

  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search:
      lang:
        - es

extra_css:
  - assets/css/custom.css

extra_javascript:
  - assets/js/custom.js

nav:
  - "Inicio": index.md
  - "Fundamentos":
    - "Módulo 1: Fundamentos": modulos/modulo-01-fundamentos.md
    - "Módulo 2: Primer workflow con n8n": modulos/modulo-02-primer-workflow.md
    - "Módulo 3: Eventos, webhooks e integraciones": modulos/modulo-03-eventos-webhooks.md
  - "IA y Agentes":
    - "Módulo 4: Asistentes y workflows de IA con Dify": modulos/modulo-04-asistentes-dify.md
    - "Módulo 5: RAG y bases de conocimiento": modulos/modulo-05-rag-conocimiento.md
    - "Módulo 6: Orquestación de agentes": modulos/modulo-06-orquestacion-agentes.md
  - "Gobierno y Operación":
    - "Módulo 7: Seguridad, gobierno y calidad": modulos/modulo-07-seguridad-gobierno.md
    - "Módulo 8: Operación y ciclo de vida": modulos/modulo-08-operacion-ciclo-vida.md
  - "Proyecto Final":
    - "Módulo 9: Caso práctico final": modulos/modulo-09-caso-final.md
